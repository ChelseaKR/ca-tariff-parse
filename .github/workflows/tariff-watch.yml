# The weekly tariff watch.
#
# Downloads each document the manifest pins and, where the publisher now
# serves different bytes, parses the revision, diffs it value by value against
# the last reviewed parse (data/parsed/<id>.json), and opens one pull request
# per revised document carrying the diff report, the new baseline and the
# manifest entry's new digest. It never merges anything and never commits a
# PDF.
#
# Every run, including a run in which nothing moved, appends one line to
# watch-log.jsonl on the `watch-log` branch -- "looked at <time>, found <n>
# changes", with every document named -- and pushes it there. That line is the
# only thing standing between "looked, and nothing changed" and "nobody looked
# this week", which are different statements that a repository with no change
# reports otherwise renders identically. A quiet week is a line that says so;
# a missed week is a line that is not there. See ADR 0019. A download that
# fails is an error, never "unchanged", and it is recorded as one.
#
# The log never touches `main`, which the protect-main ruleset protects and
# this workflow's token cannot push to. The `watch-log` branch holds that one
# file and a README, has no code on it, and is only ever fast-forwarded: no
# step here force-pushes, and a missing branch fails the run rather than being
# quietly recreated empty over the record it replaced.
#
# The manifest's pinned digest is a review gate (ADR 0003). This workflow does
# the first half of that review in advance and hands the decision to a person.
name: tariff-watch

on:
  schedule:
    # Mondays, after the CI scanners have run.
    - cron: "23 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tariff-watch
  cancel-in-progress: false

env:
  UV_VERSION: "0.12.1"

jobs:
  watch:
    name: Fetch each pinned document and diff any revision
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true

      - name: Install the locked dependency set
        run: uv sync --locked

      # The record lives on its own branch, checked out beside main rather than
      # over it. A branch that is not there is not recreated here: an empty log
      # would read as a watch that never looked, over the record it replaced.
      - name: Check out the observation log
        id: log
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/watch-log"
          if git fetch -q origin "+refs/heads/watch-log:refs/remotes/origin/watch-log"; then
            rmdir "${RUNNER_TEMP}/watch-log"
            git worktree add -q --detach "${RUNNER_TEMP}/watch-log" origin/watch-log
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Look at every pinned document
        id: overview
        run: |
          set +e
          uv run ca-tariff-parse watch --summary "${RUNNER_TEMP}/overview.json" --timeout 90 \
            --log "${RUNNER_TEMP}/watch-log/watch-log.jsonl"
          echo "exit=$?" >> "${GITHUB_OUTPUT}"
          # The overview run rewrote the manifest and baselines for anything
          # revised, and appended this run to the observation log beside main.
          # Each proposal below is rebuilt from a clean main so that one pull
          # request carries exactly one document; the log is not reverted,
          # because the look happened whatever the diff turns out to say.
          git checkout -q -- sources/sources.toml data/parsed
          git clean -fdq data/changes

      - name: Record that it looked, whatever it found
        env:
          LOG_PRESENT: ${{ steps.log.outputs.present }}
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/watch-log/watch-log.jsonl"
          if [ ! -s "${log}" ]; then
            echo "::error::the watch wrote no observation; this run's look is not recorded anywhere"
            exit 1
          fi
          line="$(tail -n 1 "${log}")"
          sentence="$(jq -r '.summary' <<< "${line}")"
          # On the run page first, so the sentence survives a push that fails.
          {
            echo "## Tariff watch"
            echo
            echo "**${sentence}**"
            echo
            echo "| document | state | detail |"
            echo "| --- | --- | --- |"
            jq -r '.documents[] | "| \(.id) | \(.state) | \(.detail) |"' <<< "${line}"
            echo
          } >> "${GITHUB_STEP_SUMMARY}"
          if [ "${LOG_PRESENT}" != "true" ]; then
            echo "::error::the watch-log branch is missing, so this look cannot be added to the record; restore the branch rather than starting a new log (ADR 0019)"
            exit 1
          fi
          cd "${RUNNER_TEMP}/watch-log"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watch-log.jsonl
          # Exactly one file, and exactly one line added to it. A run that
          # would commit anything else, or remove a line, has gone wrong and
          # must not push at all: a look already recorded is evidence.
          staged="$(git diff --cached --name-only)"
          if [ "${staged}" != "watch-log.jsonl" ]; then
            echo "::error::expected only watch-log.jsonl staged, got: ${staged:-nothing}"
            exit 1
          fi
          if [ "$(git diff --cached --numstat)" != "$(printf '1\t0\twatch-log.jsonl')" ]; then
            echo "::error::expected exactly one line added and none removed: $(git diff --cached --numstat)"
            exit 1
          fi
          git commit -q -m "tariff-watch: ${sentence}"
          # Fast-forward only: nothing here force-pushes. The concurrency group
          # makes this job the only writer, so a rejected push means someone
          # else moved the branch, and the look is replayed on top of it.
          for _ in 1 2 3; do
            if git push -q origin HEAD:refs/heads/watch-log; then
              echo "recorded: ${sentence}"
              exit 0
            fi
            git fetch -q origin "+refs/heads/watch-log:refs/remotes/origin/watch-log"
            git rebase -q origin/watch-log || { git rebase --abort; true; }
            sleep 5
          done
          echo "::error::could not record this run; the log would be silently short a look"
          exit 1

      # Proposals do not wait on the record: a revision is worth a pull
      # request even in a run that could not log itself.
      - name: Propose one pull request per revised document
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          overview="${RUNNER_TEMP}/overview.json"
          date="$(jq -r '.date' "${overview}")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for id in $(jq -r '.outcomes[] | select(.state == "changed") | .id' "${overview}"); do
            branch="tariff-watch/${id}/${date}"
            if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
              echo "::notice::${branch} already exists; not opening a second pull request for it"
              continue
            fi
            git checkout -q -B "${branch}" origin/main
            git checkout -q -- sources/sources.toml data/parsed
            git clean -fdq data/changes

            # Re-run for this one document so the commit carries only its change.
            summary="${RUNNER_TEMP}/${id}.json"
            # --no-log: this is a second look inside a run the log already
            # records, not a run of its own.
            uv run ca-tariff-parse watch --id "${id}" --summary "${summary}" \
              --no-log --timeout 90 || true
            state="$(jq -r '.outcomes[0].state' "${summary}")"
            if [ "${state}" != "changed" ]; then
              echo "::warning::${id} read as ${state} on the second look; nothing proposed. $(jq -r '.outcomes[0].detail' "${summary}")"
              continue
            fi
            report="data/changes/${date}-${id}.md"
            sha="$(jq -r '.outcomes[0].sha256' "${summary}")"
            # Three states, never two. `parser_version` is the release
            # constant, so equal stamps are "indeterminate", not "same
            # parser"; branching on the boolean alone left this checklist
            # silent in the common case (issue #46).
            parsers="$(jq -r '.outcomes[0].parser_comparison' "${summary}")"

            git add sources/sources.toml "data/parsed/${id}.json" data/changes/
            git commit -q -m "tariff-watch: ${id} was revised by its publisher (retrieved ${date})" \
              -m "Proposes the revision's digest for the manifest, the reviewed parse it would replace, and the value-level diff between the two. Opened by the weekly watch for a person to review; nothing here is merged by the watch."
            git push -q origin "${branch}"

            {
              echo "The publisher now serves different bytes for **${id}** than the manifest pins. This pull request proposes accepting the revision: the manifest entry's new digest (\`${sha}\`), retrieval date, page count and size; the new baseline under \`data/parsed/\`; and the report below, which lists every value that was added, removed or changed with the citation it was read from before and after."
              echo
              echo "**Merging this pull request is the review the manifest's digest check asks for (ADR 0003).** Before merging:"
              echo
              echo "- [ ] Read every line of the report against the publisher's document. The citations are there to be checked, not trusted."
              echo "- [ ] Run \`make fetch && make coverage-real\` and update the README's coverage table if the figures moved; \`tests/test_published_figures.py\` will fail otherwise."
              case "${parsers}" in
                different)
                  echo "- [ ] **The baseline was written by a different parser version.** Some lines below may be parser changes rather than publisher changes; re-parse the previously pinned bytes with the current parser before relying on any of them."
                  ;;
                unstated)
                  echo "- [ ] **One of these parses does not say which parser read it.** Whether a parser change is mixed into the report below is unknown; re-parse the previously pinned bytes with the current parser before relying on any line."
                  ;;
                *)
                  echo "- [ ] **Both parses state the same parser version, which does not mean one parser read them both.** That string moves only at a release, so a parser change since the baseline was written is listed below as a schedule change. If \`src/ca_tariff_parse/\` has moved since \`data/parsed/${id}.json\` was last written, re-parse the previously pinned bytes with the current parser before relying on any line."
                  ;;
              esac
              echo "- [ ] Nothing in this pull request is a PDF. If one appears, close it."
              echo
              echo "---"
              echo
              cat "${report}"
            } > "${RUNNER_TEMP}/body.md"

            gh pr create \
              --base main \
              --head "${branch}" \
              --label tariff-watch \
              --title "tariff-watch: ${id} was revised by its publisher (${date})" \
              --body-file "${RUNNER_TEMP}/body.md"
            echo "opened a pull request for ${id}" >> "${GITHUB_STEP_SUMMARY}"
          done

      - name: Fail if the watch could not look at every document
        if: ${{ !cancelled() }}
        env:
          WATCH_EXIT: ${{ steps.overview.outputs.exit }}
        run: |
          if [ "${WATCH_EXIT}" != "0" ]; then
            echo "::error::the watch could not look at every document; see the summary"
            exit 1
          fi
